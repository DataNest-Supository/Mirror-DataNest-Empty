name: Mirror-Nest Intake Gate

on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main, "release/**", "automation/**", "audit/**", "ci/**"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: mirror-nest-intake-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  intake:
    name: Mirror-Nest Intake Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate exchange contract
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/mirror-nest-intake-validate.mjs
      - name: Validate intake unit contract
        run: node --test tests/unit/mirror-nest-intake.test.mjs
